[project]
name = "pymagsims"
version = "0.1.0"
description = "Python tools for MagSIMS spectrum, image, and 3D SIMS analysis"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Till", email = "till@lssnr.de" }
]
requires-python = ">=3.11"
dependencies = [
    "ipywidgets>=8.1",
    "matplotlib>=3.8",
    "nbformat>=5.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "periodictable>=2.0",
    "plotly>=5.20",
    "pyvista>=0.48.2",
    "scipy>=1.11",
    "tifffile>=2024.0",
    "vtk>=9.6.1",
]

[project.optional-dependencies]
paraview = [
    "pyvista>=0.44",
    "vtk>=9.3",
]
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[project.scripts]
pymagsims = "pymagsims:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black",
    "ipykernel",
    "jupyterlab",
    "mypy",
    "nbstripout",
    "nbval>=0.11.0",
    "pre-commit>=4.6.0",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
